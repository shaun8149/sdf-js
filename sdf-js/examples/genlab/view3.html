<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>genlab view3 (BOB 织谱 weave)</title>
<style>body{margin:0;background:#111;display:grid;place-items:center;height:100vh}canvas{max-width:90vmin;max-height:90vmin}</style>
</head><body>
<canvas id="c" width="900" height="900"></canvas>
<script src="query-params.js"></script>
<script>{ window.genlabQuery.applyCanvasSizeFromQuery(document.getElementById("c")); }</script>
<script type="module">
// 加载 out/<id>.js: 存档 prompt 约定 import '../../src/index.js' (examples/sdf/ 视角),
// blob import 无相对基准 → 重写为绝对路径后再导入
const id = window.genlabQuery.requireSlug(new URLSearchParams(location.search).get('id'), 'id');
const src = await (await fetch(`./out/${id}.js`)).text();
const abs = new URL('../../src/index.js', location.href.replace('/genlab/view.html', '/sdf/x')).href;
let code = src.replace(/(['"])(?:\.\.\/)+src\/index\.js\1/, JSON.stringify(abs));
code = code.replace(/render\.silhouette\(ctx, layers, \{/g, "render.bobStipple(ctx, layers, { colorMode: 'weave',");
const blob = new Blob([code], { type: 'application/javascript' });
try {
  await import(URL.createObjectURL(blob));
  window.$genOK = true;
} catch (e) {
  const pre = document.createElement('pre');
  pre.style.color = '#f66';
  pre.textContent = e.stack || String(e);
  document.body.replaceChildren(pre);
  window.$genErr = String(e);
}
</script>
</body></html>
