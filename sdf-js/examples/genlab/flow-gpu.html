<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>genlab · 场流光 GPU (Phase C)</title>
<style>
body{margin:0;background:#111;display:grid;place-items:center;height:100vh;font:12px monospace;color:#888}
#stage{position:relative}
canvas{display:block;max-width:92vmin;max-height:92vmin}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
#hint{position:fixed;bottom:10px;left:0;right:0;text-align:center}
</style></head><body>
<div id="stage">
  <canvas id="c" width="900" height="900"></canvas>
  <canvas id="fx" width="900" height="900"></canvas>
</div>
<div id="hint">…</div>
<script type="module">
// =============================================================================
// WP1-GPU Phase C — 电流传导 (闪电沿 SDF=0 爬行, "抠图犹豫"版)
//
// user 裁定线 (2026-08-17):
//   v2: 电流要粗 / 连续单段 / 同刻长度 ≈ 周长 1/8
//   v3: macOS 抠图不知道 SDF —— 它看的是像素。边缘清晰处电流跑得快而锐;
//       边缘含糊处电流犹豫: 减速、变粗变糊、打滑停滞、偏离轮廓找路;
//       主电流跑走后, 含糊区留下的"子电流"余烬各自熄灭。
//
// 实现: 电流对我们自己的画做一次"抠图" —— 沿轮廓采样 weave 底图画布,
// 法向两侧颜色对比 = 清晰度 c(s)。速度/线宽/抖动/余烬全部由 c(s) 驱动。
// ?piece= &layer= &arc=0.125 &lap=7 &jag= &core= &halo= &rim= &vmin= &vmax=
// =============================================================================
import { compileSDF2ToGLSL } from '../../src/sdf/sdf2.compile.js';

const qs = new URLSearchParams(location.search);
const id = qs.get('piece') || 'dust-storm-farm';
const hint = document.getElementById('hint');

// ---- 1. 底图: view3 同路 (weave 语义锚定 — 保留作品自己的配色) ----
const src = await (await fetch(`./out/${id}.js`)).text();
const abs = new URL('../../src/index.js', location.href.replace('/genlab/flow-gpu.html', '/sdf/x')).href;
let code = src.replace(/(['"])(?:\.\.\/)+src\/index\.js\1/, JSON.stringify(abs));
// Before 态 (densityFloor: 0 = 原密度轴, 动态稀疏): 稀疏区对比度低 →
// 清晰度 c(s) 真实起伏 → 抠图犹豫有落点 (user 终裁 2026-08-17 风景全 Before)
code = code.replace(
  /render\.silhouette\(ctx, layers, \{/g,
  "render.bobStipple(ctx, layers, { colorMode: 'weave', densityFloor: 0,",
);
await import(URL.createObjectURL(new Blob([code], { type: 'application/javascript' })));

// ---- 2. 层数据 ----
const mod = await import(`./out/_audit/${id}.mjs`);
const layers = mod.__layers ?? [];
const VIEW = +(src.match(/view:\s*([\d.]+)/)?.[1] ?? 1.4);

// ---- 3. 选主角层 ----
function pickActor() {
  const forced = qs.get('layer');
  if (forced !== null) return [+forced];
  const S = 72;
  const scored = [];
  for (let li = 0; li < layers.length; li++) {
    const layer = layers[li];
    const sdf = layer && (layer.sdf ?? layer);
    const f = sdf && (sdf.f ? (p) => sdf.f(p) : sdf);
    if (!f) continue;
    if (!compileSDF2ToGLSL(sdf, { includeLibrary: false }).glsl) continue;
    let inside = 0, edgeIn = 0;
    for (let py = 0; py < S; py++) {
      const wy = -(((py + 0.5) / S) * 2 * VIEW - VIEW);
      for (let px = 0; px < S; px++) {
        const wx = ((px + 0.5) / S) * 2 * VIEW - VIEW;
        if (f([wx, wy]) < 0) {
          inside++;
          if (px === 0 || py === 0 || px === S - 1 || py === S - 1) edgeIn++;
        }
      }
    }
    const cov = inside / (S * S);
    const edgeRate = edgeIn / (4 * S);
    if (cov >= 0.05 && cov <= 0.72 && edgeRate <= 0.3) scored.push({ li, cov });
  }
  scored.sort((a, b) => b.cov - a.cov);
  return scored.slice(0, 2).map((s) => s.li);
}

const actors = pickActor();
if (!actors.length) { hint.textContent = '无可流光主角层'; throw new Error('no actor'); }
const actorLayer = layers[actors[0]];
const actorSdf = actorLayer && (actorLayer.sdf ?? actorLayer);
const fCPU = actorSdf.f ? (p) => actorSdf.f(p) : actorSdf;

// ---- 4. 主角层编译 (充能底晕用) ----
const compiled = compileSDF2ToGLSL(actorSdf, { fnName: 'sdLayer' });
if (!compiled.glsl) { hint.textContent = '编译失败: ' + compiled.error; throw new Error(compiled.error); }

// ---- 5. CPU 等值线追踪: 主环折线 + 弧长参数化 ----
function traceContour(f) {
  const G = 96;
  let best = { d: 1e9, p: null };
  for (let py = 0; py < G; py++) {
    const wy = -(((py + 0.5) / G) * 2 * VIEW - VIEW);
    for (let px = 0; px < G; px++) {
      const wx = ((px + 0.5) / G) * 2 * VIEW - VIEW;
      const d = f([wx, wy]);
      if (d < best.d) best = { d, p: [wx, wy] };
    }
  }
  if (!best.p || best.d > 0) return null;
  let step = 0.05, b = [...best.p];
  while (f(b) < 0 && b[0] < VIEW * 2) b = [b[0] + step, b[1]];
  let lo = [b[0] - step, b[1]], hi = b;
  for (let i = 0; i < 40; i++) {
    const mid = [(lo[0] + hi[0]) / 2, lo[1]];
    if (f(mid) < 0) lo = mid; else hi = mid;
  }
  let p = [(lo[0] + hi[0]) / 2, lo[1]];
  const grad = (q) => {
    const e = 0.002;
    return [
      (f([q[0] + e, q[1]]) - f([q[0] - e, q[1]])) / (2 * e),
      (f([q[0], q[1] + e]) - f([q[0], q[1] - e])) / (2 * e),
    ];
  };
  const H = 0.012;
  const pts = [p];
  const start = p;
  for (let i = 0; i < 6000; i++) {
    let g = grad(p);
    const gl = Math.hypot(g[0], g[1]) || 1;
    g = [g[0] / gl, g[1] / gl];
    let q = [p[0] - g[1] * H, p[1] + g[0] * H];
    for (let k = 0; k < 2; k++) {
      const d = f(q);
      const g2 = grad(q);
      const l2 = g2[0] * g2[0] + g2[1] * g2[1] || 1;
      q = [q[0] - (d * g2[0]) / l2, q[1] - (d * g2[1]) / l2];
    }
    pts.push(q);
    p = q;
    if (i > 20 && Math.hypot(q[0] - start[0], q[1] - start[1]) < H * 1.4) break;
  }
  const arc = [0];
  for (let i = 1; i < pts.length; i++) {
    arc.push(arc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  }
  return { pts, arc, S: arc[arc.length - 1] };
}

const contour = traceContour(fCPU);
if (!contour) { hint.textContent = '等值线追踪失败'; throw new Error('trace fail'); }

function pointAt(s) {
  const S = contour.S;
  const t = ((s % S) + S) % S;
  const { pts, arc } = contour;
  let lo = 0, hi = arc.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (arc[mid] <= t) lo = mid; else hi = mid;
  }
  const span = arc[hi] - arc[lo] || 1;
  const u = (t - arc[lo]) / span;
  return [
    pts[lo][0] + (pts[hi][0] - pts[lo][0]) * u,
    pts[lo][1] + (pts[hi][1] - pts[lo][1]) * u,
  ];
}
function normalAt(s) {
  const h = contour.S / 400;
  const a = pointAt(s - h), b = pointAt(s + h);
  const tx = b[0] - a[0], ty = b[1] - a[1];
  const l = Math.hypot(tx, ty) || 1;
  return [ty / l, -tx / l];
}

// ---- 6. "抠图"清晰度: 沿轮廓采样底图, 法向两侧颜色对比 c(s) ∈ [0,1] ----
// 抠图算法只看像素: 两侧对比高 = 边缘清晰 = 电流自信; 对比低 = 犹豫地带。
const art = document.getElementById('c');
const artW = art.width;
let clarity = null; // per-vertex, 与 contour.pts 对齐
function computeClarity() {
  const ctx2 = art.getContext('2d');
  const img = ctx2.getImageData(0, 0, artW, artW).data;
  const sample = (wx, wy) => {
    const px = Math.round(((wx / VIEW + 1) / 2) * (artW - 1));
    const py = Math.round((1 - (wy / VIEW + 1) / 2) * (artW - 1));
    if (px < 0 || py < 0 || px >= artW || py >= artW) return null;
    const k = (py * artW + px) * 4;
    return [img[k], img[k + 1], img[k + 2]];
  };
  const n = contour.pts.length;
  const raw = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const p = contour.pts[i];
    const nm = normalAt(contour.arc[i]);
    let acc = 0, cnt = 0;
    for (const dlt of [0.025, 0.045, 0.07]) {
      const a = sample(p[0] + nm[0] * dlt, p[1] + nm[1] * dlt);
      const b = sample(p[0] - nm[0] * dlt, p[1] - nm[1] * dlt);
      if (!a || !b) continue;
      acc += (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2])) / 3;
      cnt++;
    }
    raw[i] = cnt ? Math.min(1, acc / cnt / 52) : 0.5; // /52: weave 织物对比标定
  }
  // 沿弧平滑 (±8 顶点)
  clarity = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let j = -8; j <= 8; j++) s += raw[(i + j + n) % n];
    clarity[i] = s / 17;
  }
}
function clarityAt(s) {
  if (!clarity) return 1;
  const S = contour.S;
  const t = ((s % S) + S) % S;
  const { arc } = contour;
  let lo = 0, hi = arc.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (arc[mid] <= t) lo = mid; else hi = mid;
  }
  return clarity[lo];
}
// weave 底图是分块异步画的 — 等画布"画满"再算清晰度 (期间电流按全清晰跑)
(function waitArt(tries) {
  const ctx2 = art.getContext('2d');
  const d = ctx2.getImageData(artW >> 1, artW >> 1, 1, 1).data;
  const corner = ctx2.getImageData(8, 8, 1, 1).data;
  if ((d[3] > 0 && corner[3] > 0) || tries > 60) computeClarity();
  else setTimeout(() => waitArt(tries + 1), 150);
})(0);

// ---- 7. 参数 ----
const N     = 32;
const M     = 16;                              // 子电流余烬槽位
const ARC   = +(qs.get('arc') ?? 0.125);
const LAPS  = +(qs.get('lap') ?? 7);           // 全清晰时绕圈秒数
const JAG   = +(qs.get('jag') ?? 0.018);
const COREK = +(qs.get('core') ?? 95);
const HALOK = +(qs.get('halo') ?? 20);
const RIM   = +(qs.get('rim') ?? 0.07);
const VMIN  = +(qs.get('vmin') ?? 0.12);       // 含糊处速度下限 (× 基速)
const VMAX  = +(qs.get('vmax') ?? 1.65);       // 清晰处速度上限
const WANDER = +(qs.get('wander') ?? 0.022);   // 含糊处偏离轮廓找路幅度 (world)

const FS = `precision highp float;
float hash21(vec2 q) { return fract(sin(dot(q, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 q) {
  vec2 i = floor(q), f = fract(q);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 q) {
  return 0.5 * vnoise(q) + 0.3 * vnoise(q * 2.03 + 17.7) + 0.2 * vnoise(q * 4.11 + 41.3);
}
${compiled.glsl}
uniform float uT;
uniform vec2 uRes;
uniform vec3 uColor;
uniform float uHes;              // 电流头处的犹豫度 = 1 - clarity
uniform vec2 uPts[${N}];
uniform vec3 uEmb[${M}];         // 子电流余烬: xy 位置, z 强度
float dSeg(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-9), 0.0, 1.0);
  return length(pa - ba * h);
}
void main() {
  vec2 p = ((gl_FragCoord.xy / uRes) * 2.0 - 1.0) * ${VIEW.toFixed(3)};
  // 电弧锯齿域扭曲 (犹豫时更毛躁)
  float jagAmp = ${JAG.toFixed(4)} * (1.0 + 1.1 * uHes);
  vec2 warp = (vec2(fbm(p * 15.0 + uT * 2.4), fbm(p * 15.0 - uT * 2.0)) - 0.5) * jagAmp;
  vec2 pw = p + warp;
  // 主电流: 连续窗口折线距离 + 最近段序号 (头亮尾细)
  float dArc = 1e6;
  float fi = 0.0;
  for (int i = 0; i < ${N - 1}; i++) {
    float ds = dSeg(pw, uPts[i], uPts[i + 1]);
    if (ds < dArc) { dArc = ds; fi = float(i); }
  }
  float along = fi / ${(N - 2).toFixed(1)};
  // 犹豫 → 变粗变糊 (芯散开, 晕加宽); 清晰 → 细而锐
  float soften = 1.0 + 1.4 * uHes;
  float width = mix(0.45, 1.0, along) * soften;
  float core = exp(-dArc * ${COREK.toFixed(1)} / width) / soften;
  float halo = exp(-dArc * ${HALOK.toFixed(1)} / width);
  float env = mix(0.22, 1.0, along * along);
  float flicker = 0.82 + 0.18 * vnoise(vec2(uT * (6.0 + 8.0 * uHes), fi * 0.7));
  float energy = (core * 1.9 + halo * (0.5 + 0.35 * uHes)) * env * flicker;
  // 子电流余烬: 主电流跑走后在含糊区渐次熄灭的小火花
  for (int i = 0; i < ${M}; i++) {
    float inten = uEmb[i].z;
    if (inten < 0.01) continue;
    float r = length(pw - uEmb[i].xy);
    float spark = exp(-r * 130.0) * inten * (0.55 + 0.45 * vnoise(vec2(uT * 9.0, float(i) * 2.31)));
    energy += spark * 1.3;
  }
  // 全轮廓充能底晕
  float d0 = sdLayer(p);
  energy += exp(-abs(d0) * 46.0) * ${RIM.toFixed(3)};
  if (energy < 0.004) { gl_FragColor = vec4(0.0); return; }
  vec3 warm = normalize(uColor + vec3(0.55, 0.38, 0.12)) * 1.2;
  vec3 col = mix(warm, vec3(1.0), clamp(core * 1.6 - 0.1, 0.0, 1.0));
  float a = clamp(energy, 0.0, 1.0);
  gl_FragColor = vec4(col * a, a);
}`;

// ---- 8. WebGL overlay ----
const fx = document.getElementById('fx');
const gl = fx.getContext('webgl', { premultipliedAlpha: true });
if (!gl) { hint.textContent = 'NO WEBGL'; throw new Error('no webgl'); }
const vs = gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(vs, 'attribute vec2 aP; void main() { gl_Position = vec4(aP, 0.0, 1.0); }');
gl.compileShader(vs);
const fs = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(fs, FS);
gl.compileShader(fs);
if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
  hint.textContent = 'shader 编译失败 (console)';
  console.error(gl.getShaderInfoLog(fs));
  throw new Error('fs compile');
}
const prog = gl.createProgram();
gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
gl.useProgram(prog);
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'aP');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
gl.viewport(0, 0, fx.width, fx.height);
gl.uniform2f(gl.getUniformLocation(prog, 'uRes'), fx.width, fx.height);
const colorOf = actorLayer && actorLayer.color ? actorLayer.color.map((x) => Math.min(1, x / 255 + 0.25)) : [0.9, 0.8, 0.6];
gl.uniform3f(gl.getUniformLocation(prog, 'uColor'), colorOf[0], colorOf[1], colorOf[2]);
const uT = gl.getUniformLocation(prog, 'uT');
const uPts = gl.getUniformLocation(prog, 'uPts');
const uEmb = gl.getUniformLocation(prog, 'uEmb');
const uHes = gl.getUniformLocation(prog, 'uHes');
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

// ---- 9. 帧循环: 变速传导 + 打滑停滞 + 找路漂移 + 余烬生灭 ----
const ptsBuf = new Float32Array(N * 2);
const embBuf = new Float32Array(M * 3);
const embers = []; // {x, y, i0, born, life}
let sHead = 0;
let lastT = 0;
let run = true;
const t0 = performance.now();

function frame() {
  const t = (performance.now() - t0) / 1000;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;
  const baseV = contour.S / LAPS;
  const cHead = clarityAt(sHead);
  // 清晰 → 快; 含糊 → 慢 + 打滑停滞 (顿挫)
  let v = VMIN + (VMAX - VMIN) * Math.pow(cHead, 1.4);
  if (cHead < 0.4) {
    const slip = 0.5 + 0.5 * Math.sin(t * 7.3 + sHead * 29.0);
    v *= Math.max(0.06, slip); // 间歇近停
  }
  const sPrev = sHead;
  sHead += baseV * v * dt;

  // 主电流刚扫过的含糊顶点 → 溅出子电流余烬 (环形区间, 处理跨圈)
  if (clarity) {
    const { arc } = contour;
    const S = contour.S;
    const a0 = ((sPrev % S) + S) % S;
    const a1 = ((sHead % S) + S) % S;
    const passed = (x) => (a0 <= a1 ? x > a0 && x <= a1 : x > a0 || x <= a1);
    for (let i = 0; i < arc.length; i++) {
      if (passed(arc[i])) {
        const c = clarity[i];
        if (c < 0.5 && Math.random() < (0.5 - c) * 1.6 && embers.length < M * 2) {
          const nm = normalAt(arc[i]);
          const off = (Math.random() - 0.5) * 0.06;
          embers.push({
            x: contour.pts[i][0] + nm[0] * off,
            y: contour.pts[i][1] + nm[1] * off,
            i0: 0.45 + 0.75 * (1 - c),
            born: t,
            life: 0.5 + Math.random() * 1.1,
          });
        }
      }
    }
  }
  // 余烬衰减 → 熄灭
  embBuf.fill(0);
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    const age = (t - e.born) / e.life;
    if (age >= 1) { embers.splice(i, 1); continue; }
    e.cur = e.i0 * (1 - age) * (1 - age);
  }
  embers.slice(-M).forEach((e, i) => {
    embBuf[i * 3] = e.x;
    embBuf[i * 3 + 1] = e.y;
    embBuf[i * 3 + 2] = e.cur ?? 0;
  });

  // 窗口折线: 含糊处偏离轮廓"找路" (法向漂移, 越犹豫越飘)
  const L = contour.S * ARC;
  for (let i = 0; i < N; i++) {
    const s = sHead - L + (L * i) / (N - 1);
    const q = pointAt(s);
    const c = clarityAt(s);
    const nm = normalAt(s);
    const drift = (1 - c) * WANDER * Math.sin(s * 23.0 + t * 2.6 + i * 0.7);
    ptsBuf[i * 2] = q[0] + nm[0] * drift;
    ptsBuf[i * 2 + 1] = q[1] + nm[1] * drift;
  }
  gl.uniform2fv(uPts, ptsBuf);
  gl.uniform3fv(uEmb, embBuf);
  gl.uniform1f(uHes, 1 - cHead);
  gl.uniform1f(uT, t);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (run) requestAnimationFrame(frame);
}
frame();
document.getElementById('stage').addEventListener('contextmenu', (e) => { e.preventDefault(); run = !run; if (run) frame(); });

hint.textContent =
  `piece=${id} · actor #${actors[0]}/${layers.length} · 周长 ${contour.S.toFixed(2)} · 电流 ≈ ${(contour.S * ARC).toFixed(2)} · 右键暂停/续`;
window.$genOK = true;
</script>
</body></html>
